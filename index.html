
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonClipping AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0915;color:#fff;font-family:Arial,sans-serif;padding:18px}
.container{max-width:520px;margin:auto}
header{text-align:center;padding:22px 0}
h1{font-size:32px;margin:0;color:#b68cff}
header p{color:#aaa}
.card{background:#171426;border:1px solid #30264b;border-radius:18px;padding:20px;margin:15px 0}
label{display:block;margin:14px 0 7px;color:#ddd}
input,select{width:100%;padding:13px;background:#0e0c19;color:white;border:1px solid #40365b;border-radius:10px}
button{width:100%;border:0;border-radius:12px;padding:15px;background:linear-gradient(90deg,#8047ed,#b04de8);color:white;font-weight:bold;font-size:16px;margin-top:18px}
button:disabled{opacity:.5}
#status{margin-top:18px;color:#d1baff;text-align:center}
.progress{height:9px;background:#302a40;border-radius:10px;overflow:hidden;margin-top:12px}
#bar{height:100%;width:0;background:#ad70ff;transition:.3s}
#results{margin-top:20px}
.clip{background:#211b32;border:1px solid #45355f;border-radius:14px;padding:14px;margin:14px 0}
.clip video{width:100%;border-radius:10px;background:#000}
.download{display:block;text-align:center;text-decoration:none;background:#7544d5;color:white;padding:12px;border-radius:10px;margin-top:12px}
.small{font-size:12px;color:#999;text-align:center}
</style>
</head>
<body>
<div class="container">
<header>
<h1>NEONCLIPPING</h1>
<p>Turn your videos into vertical clips</p>
</header>

<div class="card">
<label>Select your video</label>
<input type="file" id="video" accept="video/mp4,video/quicktime,video/x-matroska,video/webm">

<label>Number of clips</label>
<select id="count">
<option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option>
</select>

<label>Minimum clip length</label>
<select id="min">
<option>15</option><option selected>20</option><option>30</option>
</select>

<label>Maximum clip length</label>
<select id="max">
<option>30</option><option selected>60</option><option>90</option>
</select>

<button id="generate" onclick="generateClips()">GENERATE CLIPS</button>
<p class="small">Maximum upload size: 500 MB</p>
</div>

<div class="card">
<div id="status">Upload a video to get started.</div>
<div class="progress"><div id="bar"></div></div>
<div id="results"></div>
</div>
</div>

<script>
const API="https://neonclipping-mobile.onrender.com";
let polling=false;

function showStatus(message,progress){
 document.getElementById("status").textContent=message;
 document.getElementById("bar").style.width=progress+"%";
}

async function generateClips(){
 if(polling)return;

 const file=document.getElementById("video").files[0];
 if(!file){alert("Please select a video first.");return;}
 if(file.size>500*1024*1024){alert("Video must be under 500 MB.");return;}

 const minLen=Number(document.getElementById("min").value);
 const maxLen=Number(document.getElementById("max").value);
 if(minLen>maxLen){alert("Minimum length cannot exceed maximum.");return;}

 const btn=document.getElementById("generate");
 btn.disabled=true;
 polling=true;
 document.getElementById("results").innerHTML="";
 showStatus("Uploading video...",3);

 try{
  const data=new FormData();
  data.append("video",file);
  data.append("count",document.getElementById("count").value);
  data.append("min_len",minLen);
  data.append("max_len",maxLen);
  data.append("captions","false");

  const response=await fetch(API+"/make",{method:"POST",body:data});
  const result=await response.json();

  if(!response.ok)throw new Error(result.detail||"Upload failed");

  if(!result.job_id)throw new Error("Server response mein job ID nahi mila.");

  await checkJob(result.job_id);

 }catch(error){
  showStatus("Error: "+error.message,0);
  polling=false;
  btn.disabled=false;
 }
}

async function checkJob(id){
 try{
  while(true){
   const response=await fetch(API+"/make/"+id);
   if(!response.ok)throw new Error("Job status check failed");

   const job=await response.json();
   showStatus(job.message||job.status,job.progress||0);

   if(job.status==="completed"){
    displayClips(job.clips||[]);
    showStatus("Clips ready hain!",100);
    break;
   }

   if(job.status==="error"){
    throw new Error(job.error||"Clip generation failed");
   }

   await new Promise(resolve=>setTimeout(resolve,3000));
  }
 }catch(error){
  showStatus("Error: "+error.message,0);
 }finally{
  polling=false;
  document.getElementById("generate").disabled=false;
 }
}

function displayClips(clips){
 const results=document.getElementById("results");
 results.innerHTML="";

 if(!clips.length){
  results.textContent="No clips returned by server.";
  return;
 }

 clips.forEach((clip,index)=>{
  const url=API+clip.url;
  const card=document.createElement("div");
  card.className="clip";

  const heading=document.createElement("h3");
  heading.textContent=clip.name||("Clip "+(index+1));

  const player=document.createElement("video");
  player.controls=true;
  player.playsInline=true;
  player.preload="metadata";
  player.src=url;

  const link=document.createElement("a");
  link.className="download";
  link.href=url;
  link.download="neonclip-"+(index+1)+".mp4";
  link.textContent="DOWNLOAD CLIP";

  card.append(heading,player,link);
  results.appendChild(card);
 });
}
</script>
</body>
</html>
