
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonClipping AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b14;color:#f5f7ff;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:600px;margin:auto}
.logo{font-size:28px;font-weight:800;color:#a78bfa}
.sub{color:#9ca3af;margin-top:6px}
.card{
 background:#121827;border:1px solid #293249;
 border-radius:18px;padding:20px;margin-top:22px;
}
h2{font-size:19px;margin-top:0}
label{display:block;margin:16px 0 8px;color:#cbd5e1}
input,select{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #374151;background:#0b1120;
 color:white;font-size:15px;
}
input[type=file]{padding:12px}
button{
 width:100%;padding:15px;border:0;border-radius:12px;
 background:#8b5cf6;color:white;font-weight:bold;
 font-size:16px;margin-top:20px;
}
button:disabled{opacity:.5}
.progress{
 height:9px;background:#293249;border-radius:20px;
 overflow:hidden;margin-top:16px;
}
.bar{height:100%;width:0%;background:#a78bfa}
.status{color:#c4b5fd;margin-top:14px}
.clip{
 padding:14px;background:#0b1120;
 border:1px solid #293249;border-radius:12px;
 margin-top:12px;
}
a{color:#a78bfa;font-weight:bold}
.small{font-size:12px;color:#9ca3af}
</style>
</head>

<body>
<div class="container">
 <div class="logo">NEONCLIPPING</div>
 <div class="sub">AI Video Clipper · Turn videos into short clips</div>

 <div class="card">
  <h2>Upload your video</h2>

  <label>Select video from gallery</label>
  <input id="video" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm">

  <p class="small" id="fileInfo">MP4, MOV, MKV or WEBM · Maximum 500 MB</p>

  <label>Number of clips</label>
  <select id="count">
   <option value="1">1 Clip</option>
   <option value="2">2 Clips</option>
   <option value="3" selected>3 Clips</option>
   <option value="5">5 Clips</option>
   <option value="10">10 Clips</option>
  </select>

  <label>Minimum clip duration</label>
  <select id="min">
   <option value="15">15 seconds</option>
   <option value="20" selected>20 seconds</option>
   <option value="30">30 seconds</option>
  </select>

  <label>Maximum clip duration</label>
  <select id="max">
   <option value="30">30 seconds</option>
   <option value="45">45 seconds</option>
   <option value="60" selected>60 seconds</option>
   <option value="90">90 seconds</option>
  </select>

  <label>
   <input id="captions" type="checkbox" checked style="width:auto">
   Add automatic captions
  </label>

  <button id="generate" onclick="generateClips()">Generate Clips</button>
 </div>

 <div class="card">
  <h2>Processing</h2>
  <div id="status" class="status">Waiting for video...</div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="results"></div>
 </div>
</div>

<script>
const API="https://neonclipping-mobile.onrender.com";

const video=document.getElementById("video");
const button=document.getElementById("generate");

video.addEventListener("change",()=>{
 const f=video.files[0];
 document.getElementById("fileInfo").textContent =
 f ? f.name+" · "+(f.size/1024/1024).toFixed(1)+" MB"
 : "MP4, MOV, MKV or WEBM · Maximum 500 MB";
});

function showStatus(message,progress){
 document.getElementById("status").textContent=message;
 document.getElementById("bar").style.width=progress+"%";
}

async function generateClips(){
 const file=video.files[0];

 if(!file){
  alert("Please select a video first.");
  return;
 }

 if(file.size>500*1024*1024){
  alert("Maximum video size is 500 MB.");
  return;
 }

 const min=Number(document.getElementById("min").value);
 const max=Number(document.getElementById("max").value);

 if(min>max){
  alert("Maximum duration must be greater than minimum duration.");
  return;
 }

 button.disabled=true;
 document.getElementById("results").innerHTML="";
 showStatus("Uploading video...",5);

 try{
  const form=new FormData();
  form.append("video",file);
  form.append("count",document.getElementById("count").value);
  form.append("min_len",min);
  form.append("max_len",max);
  form.append("captions",document.getElementById("captions").checked);

  const response=await fetch(API+"/make",{
   method:"POST",
   body:form
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.detail||"Upload failed");
  }

  if(!data.job_id){
   throw new Error("Server response mein job ID nahi mila.");
  }

  showStatus("Video uploaded. Processing started...",10);

  let finished=false;

  while(!finished){
   await new Promise(resolve=>setTimeout(resolve,5000));

   const check=await fetch(API+"/make/"+data.job_id);
   const result=await check.json();

   if(!check.ok){
    throw new Error(result.detail||"Status check failed");
   }

   showStatus(result.message||"Processing...",result.progress||0);

   if(result.status==="done"){
    finished=true;
    showStatus("Your clips are ready!",100);

    document.getElementById("results").innerHTML=
     "<h2>Your clips</h2>";

    result.clips.forEach((clip)=>{
     const url=API+clip.url;
     const div=document.createElement("div");
     div.className="clip";

     const title=document.createElement("p");
     title.textContent=clip.name;

     const link=document.createElement("a");
     link.href=url;
     link.target="_blank";
     link.rel="noopener";
     link.textContent="Open / Download Clip";

     div.append(title,link);
     document.getElementById("results").appendChild(div);
    });
   }

   if(result.status==="error"){
    throw new Error(result.error||result.message||"Processing failed");
   }
  }

 }catch(error){
  showStatus("Error: "+error.message,0);
 }finally{
  button.disabled=false;
 }
}
</script>
</body>
</html>
