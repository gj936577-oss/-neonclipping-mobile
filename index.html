
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090713">
<title>NeonClipping AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px 16px 40px;color:#fff;
 font-family:Arial,sans-serif;
 background:
 radial-gradient(ellipse at 15% 5%,rgba(130,65,220,.35),transparent 40%),
 radial-gradient(ellipse at 90% 55%,rgba(65,55,180,.25),transparent 42%),
 linear-gradient(145deg,#080711,#121020,#090713);
}
.container{max-width:520px;margin:auto}
header{text-align:center;padding:28px 0 25px}
.logo{
 font-size:34px;font-weight:900;letter-spacing:2px;
 background:linear-gradient(100deg,#e6caff,#a77bff,#f2d5ff);
 -webkit-background-clip:text;color:transparent;
}
header p{color:#aaa4bd;font-size:14px;margin-top:9px}
.glass{
 background:rgba(255,255,255,.075);
 border:1px solid rgba(255,255,255,.14);
 border-radius:23px;padding:21px;margin:16px 0;
 box-shadow:0 12px 40px rgba(0,0,0,.25);
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
}
.section-title{font-size:17px;font-weight:bold;margin:0 0 18px;color:#eadcff}
label{display:block;color:#ded6ed;font-size:13px;margin:17px 0 8px}
input,select{
 width:100%;min-height:48px;padding:13px;color:white;
 background:rgba(10,8,25,.65);
 border:1px solid rgba(255,255,255,.16);
 border-radius:13px;outline:none;font-size:14px;
}
input:focus,select:focus{border-color:#b78aff}
input[type=file]{padding:11px;font-size:12px}
select option{background:#171426;color:white}
.file-info{color:#aaa1ba;font-size:12px;margin-top:8px;overflow-wrap:anywhere}
button{
 width:100%;padding:16px;margin-top:22px;
 border:1px solid rgba(255,255,255,.25);
 border-radius:15px;color:white;font-size:15px;font-weight:bold;
 letter-spacing:1px;
 background:linear-gradient(110deg,#7944d9,#ae62ed,#7545d9);
 box-shadow:0 6px 25px rgba(139,76,230,.3);cursor:pointer;
}
button:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:11px;color:#9d96ae;text-align:center;margin:14px 0 0}
.status-card{text-align:center}
.status-icon{
 width:48px;height:48px;margin:0 auto 14px;
 display:grid;place-items:center;border-radius:16px;
 background:rgba(177,123,255,.15);
 border:1px solid rgba(205,168,255,.2);font-size:23px;
}
#status{color:#e2d2ff;font-size:14px;min-height:20px;line-height:1.5}
.progress{
 height:13px;margin-top:19px;background:rgba(255,255,255,.11);
 border:1px solid rgba(255,255,255,.12);
 border-radius:30px;overflow:hidden;
}
#bar{
 width:0%;height:100%;border-radius:30px;
 background:linear-gradient(90deg,#874aff,#d7a5ff,#9d65ff);
 box-shadow:0 0 15px #a66bff;
 transition:width .15s ease;position:relative;overflow:hidden;
}
#bar.active:after{
 content:"";position:absolute;top:0;left:-45%;
 width:35%;height:100%;background:rgba(255,255,255,.55);
 transform:skewX(-25deg);animation:shine 1.3s infinite;
}
@keyframes shine{from{left:-45%}to{left:120%}}
#percentage{
 font-size:29px;font-weight:bold;color:#d8baff;
 margin-top:13px;font-variant-numeric:tabular-nums;
}
#speed{font-size:12px;color:#aaa1ba;margin-top:5px}
#results{margin-top:20px}
.clip{
 background:rgba(255,255,255,.065);
 border:1px solid rgba(255,255,255,.14);
 border-radius:18px;padding:14px;margin:15px 0;
}
.clip h3{color:#e7d6ff;font-size:16px}
.clip video{width:100%;border-radius:13px;background:#000}
.download{
 display:block;text-align:center;text-decoration:none;color:white;
 padding:14px;border-radius:12px;margin-top:12px;
 background:linear-gradient(100deg,#7944d9,#a34ce5);
 font-weight:bold;font-size:14px;
}
.footer{text-align:center;color:#716b81;font-size:11px;margin-top:25px}
@media(max-width:380px){.logo{font-size:28px}.glass{padding:17px}}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="logo">NEONCLIPPING</div>
 <p>Turn your videos into vertical clips</p>
</header>

<div class="glass">
 <h2 class="section-title">✦ Create Your Clips</h2>

 <label>Select Your Video</label>
 <input type="file" id="video"
 accept="video/mp4,video/quicktime,video/x-matroska,video/webm">
 <div class="file-info" id="fileInfo">Choose a video from your device</div>

 <label>Number of Clips</label>
 <select id="count">
  <option value="1">1 Clip</option>
  <option value="2">2 Clips</option>
  <option value="3" selected>3 Clips</option>
  <option value="5">5 Clips</option>
  <option value="10">10 Clips</option>
 </select>

 <label>Minimum Clip Length</label>
 <select id="min">
  <option value="15">15 Seconds</option>
  <option value="20" selected>20 Seconds</option>
  <option value="30">30 Seconds</option>
 </select>

 <label>Maximum Clip Length</label>
 <select id="max">
  <option value="30">30 Seconds</option>
  <option value="60" selected>60 Seconds</option>
  <option value="90">90 Seconds</option>
 </select>

 <button id="generate" onclick="generateClips()">GENERATE CLIPS ✦</button>
 <p class="small">Maximum upload size: 500 MB</p>
</div>

<div class="glass status-card">
 <div class="status-icon">✧</div>
 <div id="status">Your clips are waiting to be created.</div>
 <div class="progress"><div id="bar"></div></div>
 <div id="percentage">0%</div>
 <div id="speed">Ready</div>
 <div id="results"></div>
</div>

<div class="footer">NEONCLIPPING AI • CREATE SOMETHING AMAZING</div>
</div>

<script>
const API="https://neonclipping-mobile.onrender.com";
const CHUNK_WORKERS=3;
let busy=false;

const videoInput=document.getElementById("video");

videoInput.addEventListener("change",()=>{
 const file=videoInput.files[0];
 document.getElementById("fileInfo").textContent=
 file ? file.name+" • "+(file.size/1024/1024).toFixed(2)+" MB"
 : "Choose a video from your device";
});

function showStatus(message,progress,active=true){
 const bar=document.getElementById("bar");
 document.getElementById("status").textContent=message;
 const value=Math.max(0,Math.min(100,Number(progress)||0));
 bar.style.width=value+"%";
 bar.classList.toggle("active",active);
 document.getElementById("percentage").textContent=Math.round(value)+"%";
}

function formatSpeed(bytesPerSecond){
 if(bytesPerSecond>=1024*1024){
  return (bytesPerSecond/1024/1024).toFixed(2)+" MB/s";
 }
 return (bytesPerSecond/1024).toFixed(1)+" KB/s";
}

function xhrChunk(url,blob,onProgress){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  xhr.open("PUT",url);
  xhr.setRequestHeader("Content-Type","application/octet-stream");
  xhr.timeout=0;

  xhr.upload.onprogress=e=>{
   if(e.lengthComputable)onProgress(e.loaded);
  };

  xhr.onload=()=>{
   if(xhr.status>=200&&xhr.status<300){
    resolve();
   }else{
    let message="Chunk upload failed";
    try{
     const data=JSON.parse(xhr.responseText);
     message=data.detail||message;
    }catch(e){}
    reject(new Error(message));
   }
  };

  xhr.onerror=()=>reject(new Error("Network connection failed"));
  xhr.onabort=()=>reject(new Error("Upload cancelled"));
  xhr.send(blob);
 });
}

async function uploadChunk(uploadId,index,blob,onProgress){
 let lastError;

 for(let attempt=1;attempt<=3;attempt++){
  try{
   await xhrChunk(
    API+"/fast/"+uploadId+"/chunks/"+index,
    blob,
    onProgress
   );
   onProgress(blob.size);
   return;
  }catch(error){
   lastError=error;
   onProgress(0);
   if(attempt<3){
    await new Promise(r=>setTimeout(r,1000*attempt));
   }
  }
 }

 throw lastError;
}

async function startUpload(file){
 const response=await fetch(API+"/fast/start",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   filename:file.name,
   size:file.size
  })
 });

 const data=await response.json();

 if(!response.ok){
  throw new Error(data.detail||"Upload start failed");
 }

 if(!data.upload_id||!data.chunk_size||!data.total_chunks){
  throw new Error("Invalid upload session response");
 }

 return data;
}

async function uploadVideo(file,session){
 const uploadId=session.upload_id;
 const chunkSize=session.chunk_size;
 const totalChunks=session.total_chunks;

 const loaded=new Array(totalChunks).fill(0);
 let uploadedBytes=0;
 let nextIndex=0;
 let failed=null;

 const startedAt=performance.now();

 function updateProgress(){
  const elapsed=Math.max((performance.now()-startedAt)/1000,0.1);
  const speed=uploadedBytes/elapsed;
  const percent=(uploadedBytes/file.size)*100;

  showStatus(
   "Uploading video • "+(uploadedBytes/1024/1024).toFixed(1)+
   " / "+(file.size/1024/1024).toFixed(1)+" MB",
   percent,
   true
  );

  document.getElementById("speed").textContent=
   "Upload speed: "+formatSpeed(speed);
 }

 async function worker(){
  while(true){
   if(failed) return;

   const index=nextIndex++;
   if(index>=totalChunks)return;

   const start=index*chunkSize;
   const end=Math.min(start+chunkSize,file.size);
   const blob=file.slice(start,end);

   try{
    await uploadChunk(
     uploadId,
     index,
     blob,
     loadedNow=>{
      const next=Math.min(loadedNow,blob.size);
      uploadedBytes+=next-loaded[index];
      loaded[index]=next;
      updateProgress();
     }
    );
   }catch(error){
    failed=error;
    return;
   }
  }
 }

 const workers=[];
 for(let i=0;i<Math.min(CHUNK_WORKERS,totalChunks);i++){
  workers.push(worker());
 }

 await Promise.all(workers);

 if(failed)throw failed;

 showStatus("All chunks uploaded. Preparing video...",99,false);
 document.getElementById("speed").textContent="Combining video chunks...";
 return uploadId;
}

async function generateClips(){
 if(busy)return;

 const file=videoInput.files[0];

 if(!file){alert("Please select a video first.");return}
 if(file.size>500*1024*1024){alert("Video must be under 500 MB.");return}

 const minLen=Number(document.getElementById("min").value);
 const maxLen=Number(document.getElementById("max").value);
 const count=Number(document.getElementById("count").value);

 if(minLen>maxLen){
  alert("Minimum length cannot exceed maximum.");
  return;
 }

 busy=true;
 const btn=document.getElementById("generate");
 btn.disabled=true;
 document.getElementById("results").innerHTML="";
 document.getElementById("speed").textContent="Starting...";

 try{
  showStatus("Creating upload session...",0,true);

  const session=await startUpload(file);

  showStatus("Starting fast upload...",0,true);

  const uploadId=await uploadVideo(file,session);

  showStatus("Upload complete. Starting clip generation...",100,false);
  document.getElementById("speed").textContent="Processing on server...";

  const params=new URLSearchParams({
   count:String(count),
   min_len:String(minLen),
   max_len:String(maxLen)
  });

  const response=await fetch(
   API+"/fast/"+uploadId+"/generate?"+params.toString(),
   {method:"POST"}
  );

  const result=await response.json();

  if(!response.ok){
   throw new Error(
    typeof result.detail==="string"
    ? result.detail
    : "Clip generation start failed"
   );
  }

  if(!result.job_id){
   throw new Error("Server response mein job ID nahi mila.");
  }

  await checkJob(result.job_id);

 }catch(error){
  showStatus("Error: "+error.message,0,false);
  document.getElementById("speed").textContent="Please try again.";
 }finally{
  busy=false;
  btn.disabled=false;
 }
}

async function checkJob(id){
 try{
  while(true){
   const response=await fetch(API+"/make/"+id);

   if(!response.ok)throw new Error("Job status check failed");

   const job=await response.json();

   if(job.status==="completed"){
    displayClips(job.clips||[]);
    showStatus("Your clips are ready!",100,false);
    document.getElementById("speed").textContent="Completed";
    break;
   }

   if(job.status==="error"){
    throw new Error(job.error||"Clip generation failed");
   }

   showStatus(
    job.message||"Processing your video...",
    Number(job.progress)||0,
    true
   );

   document.getElementById("speed").textContent="Clip generation in progress";

   await new Promise(resolve=>setTimeout(resolve,3000));
  }
 }catch(error){
  throw error;
 }
}

function displayClips(clips){
 const results=document.getElementById("results");
 results.innerHTML="";

 if(!clips.length){
  results.textContent="No clips returned by server.";
  return;
 }

 clips.forEach((clip,index)=>{
  const url=API+clip.url;
  const card=document.createElement("div");
  card.className="clip";

  const heading=document.createElement("h3");
  heading.textContent=clip.name||("Clip "+(index+1));

  const player=document.createElement("video");
  player.controls=true;
  player.playsInline=true;
  player.preload="metadata";
  player.src=url;

  const link=document.createElement("a");
  link.className="download";
  link.href=url;
  link.download="neonclip-"+(index+1)+".mp4";
  link.textContent="DOWNLOAD CLIP ↓";

  card.append(heading,player,link);
  results.appendChild(card);
 });
}
</script>
</body>
</html>
